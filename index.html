<html>
<head>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div>
            <h3>HOME</h3>
            <div class="home-score"></div>
            <div class="home-points-text" id="home-score">0</div>
            <div class="add-points-btns-home">
                <button onclick="addPoints1Home()">+1</button>
                <button onclick="addPoints2Home()">+2</button>
                <button onclick="addPoints3Home()">+3</button>
            </div>
        </div>
        <div>
            <h3>GUEST</h3>
            <div class="guest-score"></div>
            <div class="guest-points-text" id="guest-score">0</div>
            <div class="add-points-btns-guest">
                <button onclick="addPoints1Guest()">+1</button>
                <button onclick="addPoints2Guest()">+2</button>
                <button onclick="addPoints3Guest()">+3</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
