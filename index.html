<html>
<head>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div>
            <h3>HOME</h3>
            <div class="Home-score"></div>
            <div class="Home-points-text" id="Home-score">0</div>
            <div class="add-points-btns-Home">
                <button onclick="addPoints1Home()">+1</button>
                <button onclick="addPoints2Home()">+2</button>
                <button onclick="addPoints3Home()">+3</button>
            </div>
        </div>
        <div>
            <h3>AWAY</h3>
            <div class="Away-score"></div>
            <div class="Away-points-text" id="Away-score">0</div>
            <div class="add-points-btns-Away">
                <button onclick="addPoints1Away()">+1</button>
                <button onclick="addPoints2Away()">+2</button>
                <button onclick="addPoints3Away()">+3</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
